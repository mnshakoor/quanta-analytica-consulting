<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BlockShift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: HUD (level, moves vs par), one canvas stage with the 6x6 board and its exit on the right, action row below. Single dark look by choice. */
:root {
  --bg: #11151d;
  --panel: #1b2230;
  --edge: #2c374c;
  --fg: #f2f2ee;
  --mute: #8d9ab0;
  --gold: #ffc233;
  --red: #ff4b4b;
  --f-display: 'Outfit', system-ui, sans-serif;
  --f-body: 'DM Sans', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
}
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-block: 12px; box-sizing: border-box; }
.hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.big { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-left: 8px; }
.right { text-align: right; }
.right .big span { color: var(--mute); font-size: 18px; }
.right .big.warn { color: #ff8a7a; }
.status { min-height: 20px; font-size: 13.5px; font-weight: 700; color: var(--mute); text-align: center; text-wrap: balance; }
.stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
button {
  font: 700 13px var(--f-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 999px;
  padding: 9px 16px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover:not(:disabled) { border-color: #4a6088; }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button[aria-pressed="true"] { background: #3a2f10; border-color: var(--gold); color: var(--gold); }
button.primary { background: var(--gold); color: #2a1d00; border-color: var(--gold); font-size: 15px; padding: 11px 26px; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(9, 12, 18, .78); padding: 8px; box-sizing: border-box; }
.card { background: var(--panel); border: 1px solid var(--edge); border-radius: 20px; padding: 24px 26px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 320px; }
.card h2 { font-family: var(--f-display); font-size: 30px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--mute); font-weight: 500; line-height: 1.45; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 40px; height: 40px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.build { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); font-weight: 700; pointer-events: none; }
.picker { width: 100%; max-width: 520px; height: 100%; max-height: 100%; background: var(--panel); border: 1px solid var(--edge); border-radius: 20px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.picker header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
.picker h2 { font-family: var(--f-display); font-size: 24px; margin: 0; }
.tabs { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; }
.tabs button { white-space: nowrap; padding: 7px 12px; }
.grid { overflow-y: auto; padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-content: start; }
.lv { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 12px; font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.lv.cur { border-color: var(--gold); }
.pips { display: flex; gap: 2px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: #34425b; }
.pips i.on { background: var(--gold); }
@media (prefers-reduced-motion: reduce) { button:active:not(:disabled) { transform: none; } }
</style>

<div class="app">
  <div class="hud">
    <div>
      <div class="eyebrow">BlockShift</div>
      <div class="big"><span id="lvl">Level 1</span><small id="tier">Rookie</small></div>
    </div>
    <div class="right">
      <div class="eyebrow" id="mlabel">Moves</div>
      <div class="big" id="moves">0 <span id="par">par 3</span></div>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Sliding block board. Drag blocks along their length to clear a path for the red block to reach the exit on the right."></canvas>
    <div class="build" id="build" hidden>Building puzzle</div>
    <div class="overlay" id="overlay" hidden></div>
  </div>
  <div class="btns">
    <button type="button" id="undoBtn">Undo</button>
    <button type="button" id="resetBtn">Reset</button>
    <button type="button" id="hintBtn">Hint</button>
    <button type="button" id="limitBtn" aria-pressed="false">Move limit: off</button>
    <button type="button" id="lvlBtn">Levels</button>
  </div>
</div>

<script>
(function () {
  var N = 6, EXIT = 4, MAXLEVEL = 300, CAP = 20000;
  var TIERS = ['Rookie', 'Apprentice', 'Adept', 'Expert', 'Master', 'Grandmaster'];
  var PAL = ['#2ec4b6', '#ffb703', '#8b7bff', '#4cc9f0', '#9bd63c', '#ff6b9a', '#fb8f33', '#5b8cff', '#c77dff', '#43d17c'];
  var NAMES = ['teal', 'amber', 'violet', 'sky', 'lime', 'pink', 'orange', 'blue', 'purple', 'green'];
  var TARGET = '#ff4b4b';

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1, cell = 50, F = 7, bx = 0, by = 0, bw = 0, ix = 0, iy = 0;
  var save = { stars: {}, limit: false, level: 1 };
  var level = 1, puzzle = null, blocks = [], moves = 0, par = 0, limit = 0, hist = [];
  var state = 'loading', drag = null, hint = null, loadTok = 0, last = performance.now(), winAt = 0;
  var cache = {}, inflight = {};

  try { var s = JSON.parse(localStorage.getItem('blockshift-v1') || 'null'); if (s && s.stars) save = s; } catch (e) {}
  function persist() { try { localStorage.setItem('blockshift-v1', JSON.stringify(save)); } catch (e) {} }

  /* ---------- random + solver ---------- */
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function cellIdx(d, c) { return d.dir === 0 ? d.fixed * N + c : c * N + d.fixed; }
  function key(pos) { var k = 0; for (var i = pos.length - 1; i >= 0; i--) k = k * 8 + pos[i]; return k; }

  function solve(def, start, cap) {
    var n = def.length, grid = new Int8Array(N * N), seen = new Set([key(start)]);
    var Q = [start], par = [-1], mv = [null], h = 0, pos = null;
    function add(i, np) {
      var s = pos.slice(); s[i] = np; var k = key(s);
      if (!seen.has(k)) { seen.add(k); Q.push(s); par.push(h); mv.push({ i: i, from: pos[i], to: np }); }
    }
    for (h = 0; h < Q.length; h++) {
      pos = Q[h];
      if (pos[0] === EXIT) {
        var path = [];
        for (var x = h; par[x] >= 0; x = par[x]) path.push(mv[x]);
        path.reverse();
        return { depth: path.length, path: path };
      }
      if (Q.length > cap) return { depth: -2 };
      grid.fill(-1);
      var i, k, d;
      for (i = 0; i < n; i++) { d = def[i]; for (k = 0; k < d.len; k++) grid[cellIdx(d, pos[i] + k)] = i; }
      for (i = 0; i < n; i++) {
        d = def[i];
        var p = pos[i], np;
        for (np = p - 1; np >= 0; np--) { if (grid[cellIdx(d, np)] >= 0) break; add(i, np); }
        for (np = p + 1; np + d.len <= N; np++) { if (grid[cellIdx(d, np + d.len - 1)] >= 0) break; add(i, np); }
      }
    }
    return { depth: -1 };
  }

  function occ(bl) {
    var g = new Int8Array(N * N).fill(-1);
    bl.forEach(function (b, i) { for (var k = 0; k < b.len; k++) g[cellIdx(b, b.pos + k)] = i; });
    return g;
  }
  function tryAdd(bl, rng) {
    var g = occ(bl);
    for (var t = 0; t < 40; t++) {
      var dir = rng() < 0.55 ? 1 : 0, len = rng() < 0.3 ? 3 : 2, fixed = Math.floor(rng() * N);
      if (dir === 0 && fixed === 2) continue;
      var pos = Math.floor(rng() * (N - len + 1)), ok = true;
      for (var k = 0; k < len; k++) if (g[cellIdx({ dir: dir, fixed: fixed }, pos + k)] >= 0) { ok = false; break; }
      if (ok) return { dir: dir, len: len, fixed: fixed, pos: pos };
    }
    return null;
  }
  function evalBlocks(bl) {
    return solve(bl, bl.map(function (b) { return b.pos; }), CAP).depth;
  }

  function generate(L) {
    return new Promise(function (resolve) {
      var rng = mulberry(L * 7919 + 1337);
      var desired = Math.min(26, Math.round(3 + (L - 1) * 0.078));
      var nOther = Math.min(11, 4 + Math.floor((L - 1) / 38));
      var best = null, attempts = 0, it = 0, MAXIT = 160;
      function finish() {
        var order = PAL.map(function (c, i) { return i; });
        for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t; }
        var def = best.bl.map(function (b, i) { return { dir: b.dir, len: b.len, fixed: b.fixed, color: i === 0 ? -1 : order[(i - 1) % order.length] }; });
        var start = best.bl.map(function (b) { return b.pos; });
        resolve({ def: def, start: start, par: best.d });
      }
      function unit() {
        if (!best) {
          var bl = [{ dir: 0, len: 2, fixed: 2, pos: Math.floor(rng() * 3) }];
          for (var k = 0; k < nOther; k++) { var b = tryAdd(bl, rng); if (b) bl.push(b); }
          var d = evalBlocks(bl); attempts++;
          if (d >= 1) best = { bl: bl, d: d };
          else if (attempts > 60) {
            bl = [{ dir: 0, len: 2, fixed: 2, pos: 0 }, { dir: 1, len: 2, fixed: 3, pos: 1 }, { dir: 1, len: 3, fixed: 4, pos: 1 }, { dir: 0, len: 2, fixed: 0, pos: 2 }];
            best = { bl: bl, d: Math.max(1, evalBlocks(bl)) };
          }
          setTimeout(unit, 0); return;
        }
        if (best.d >= desired || it >= MAXIT) { finish(); return; }
        it++;
        var cand = best.bl.map(function (b) { return { dir: b.dir, len: b.len, fixed: b.fixed, pos: b.pos }; });
        var idx = 1 + Math.floor(rng() * (cand.length - 1));
        if (cand.length > 1) {
          cand.splice(idx, 1);
          var nb = tryAdd(cand, rng);
          if (nb) cand.push(nb);
          var dd = evalBlocks(cand);
          if (dd >= best.d && dd >= 1) best = { bl: cand, d: dd };
        }
        setTimeout(unit, 0);
      }
      unit();
    });
  }
  function getPuzzle(L) {
    if (cache[L]) return Promise.resolve(cache[L]);
    if (!inflight[L]) inflight[L] = generate(L).then(function (p) { cache[L] = p; delete inflight[L]; return p; });
    return inflight[L];
  }

  /* ---------- game flow ---------- */
  function tierOf(L) { return Math.min(TIERS.length - 1, Math.floor((L - 1) / 50)); }
  function starsFor(m) { return m <= par ? 3 : m <= par + Math.ceil(par * 0.5) ? 2 : 1; }
  function setStatus(t) { $('status').textContent = t || ''; }

  function loadLevel(L) {
    level = Math.max(1, Math.min(MAXLEVEL, L));
    save.level = level; persist();
    var tok = ++loadTok;
    state = 'loading'; hideOverlay();
    var ready = !!cache[level];
    $('build').hidden = ready;
    updateHud();
    getPuzzle(level).then(function (p) {
      if (tok !== loadTok) return;
      $('build').hidden = true;
      setup(p);
      setTimeout(function () { if (level < MAXLEVEL) getPuzzle(level + 1); }, 500);
    });
  }
  function setup(p) {
    puzzle = p; par = p.par;
    blocks = p.def.map(function (d, i) { return { dir: d.dir, len: d.len, fixed: d.fixed, color: d.color, pos: p.start[i], v: p.start[i] }; });
    moves = 0; hist = []; drag = null; hint = null; state = 'play';
    limit = Math.ceil(par * 1.5) + 2;
    setStatus(level <= 2 ? 'Drag the red block out through the gold exit. Blocks slide only along their length.' : '');
    updateHud();
  }
  function updateHud() {
    $('lvl').textContent = 'Level ' + level;
    $('tier').textContent = TIERS[tierOf(level)];
    var lim = save.limit && state !== 'loading';
    $('mlabel').textContent = lim ? 'Moves left' : 'Moves';
    $('moves').firstChild.nodeValue = (lim ? Math.max(0, limit - moves) : moves) + ' ';
    $('moves').classList.toggle('warn', lim && limit - moves <= 2);
    $('par').textContent = state === 'loading' ? '' : 'par ' + par;
    $('limitBtn').setAttribute('aria-pressed', String(!!save.limit));
    $('limitBtn').textContent = 'Move limit: ' + (save.limit ? 'on' : 'off');
    var off = state !== 'play';
    $('undoBtn').disabled = off || !hist.length;
    $('resetBtn').disabled = off || (!moves && !hist.length);
    $('hintBtn').disabled = off;
  }

  function starSvg(on) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.5 6 20.9l1.3-6.7-5-4.7 6.8-.8z" fill="' + (on ? '#ffc233' : '#34425b') + '" stroke="' + (on ? '#b57d00' : '#2c374c') + '" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  }
  function hideOverlay() { $('overlay').hidden = true; $('overlay').innerHTML = ''; }
  function showResult(win, st) {
    var o = $('overlay');
    o.innerHTML = '<div class="card"><h2></h2>' + (win ? '<div class="stars">' + [1, 2, 3].map(function (i) { return starSvg(i <= st); }).join('') + '</div>' : '') + '<p></p><div class="row"></div></div>';
    o.querySelector('h2').textContent = win ? 'Level ' + level + ' cleared' : 'Out of moves';
    o.querySelector('p').textContent = win ? moves + ' move' + (moves === 1 ? '' : 's') + ', par ' + par + (st === 3 ? '. Perfect.' : '.') : 'The red block is still stuck. Try a different order.';
    var row = o.querySelector('.row');
    function btn(t, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (cls) b.className = cls; b.onclick = fn; row.appendChild(b); return b; }
    var first;
    if (win && level < MAXLEVEL) first = btn('Next level', 'primary', function () { loadLevel(level + 1); });
    else if (!win) first = btn('Retry', 'primary', function () { retry(); });
    btn(win ? 'Replay' : 'Undo move', '', function () { if (win) retry(); else { hideOverlay(); state = 'play'; undo(); } });
    btn('Levels', '', openPicker);
    o.hidden = false;
    try { first && first.focus(); } catch (e) {}
  }
  function retry() { hideOverlay(); setup(puzzle); }

  function finishMove(i, from) {
    moves++; hist.push({ i: i, from: from });
    hint = null;
    if (blocks[0].pos === EXIT) {
      state = 'won'; blocks[0].pos = N + 1.3; winAt = performance.now();
      var st = starsFor(moves);
      if ((save.stars[level] || 0) < st) save.stars[level] = st;
      persist(); updateHud();
      setTimeout(function () { if (state === 'won') showResult(true, st); }, reduce ? 150 : 750);
      return;
    }
    if (save.limit && moves >= limit) {
      state = 'lost'; updateHud();
      setTimeout(function () { if (state === 'lost') showResult(false); }, 350);
      return;
    }
    updateHud();
  }
  function undo() {
    if (state !== 'play' || !hist.length) return;
    var h = hist.pop(); blocks[h.i].pos = h.from; moves = Math.max(0, moves - 1); hint = null; updateHud();
  }

  $('undoBtn').addEventListener('click', undo);
  $('resetBtn').addEventListener('click', function () { if (state === 'play') setup(puzzle); });
  $('hintBtn').addEventListener('click', function () {
    if (state !== 'play') return;
    var res = solve(blocks, blocks.map(function (b) { return b.pos; }), 60000);
    if (!res.path || !res.path.length) { setStatus('No hint available. Try Reset.'); return; }
    var m = res.path[0], b = blocks[m.i];
    hint = { i: m.i, to: m.to, until: performance.now() + 4000 };
    var dist = Math.abs(m.to - m.from);
    var dirTxt = b.dir === 0 ? (m.to > m.from ? 'right' : 'left') : (m.to > m.from ? 'down' : 'up');
    setStatus('Slide the ' + (m.i === 0 ? 'red' : NAMES[b.color]) + ' block ' + dirTxt + ' ' + dist + (dist === 1 ? ' cell.' : ' cells.'));
  });
  $('limitBtn').addEventListener('click', function () { save.limit = !save.limit; persist(); updateHud(); });
  $('lvlBtn').addEventListener('click', openPicker);

  /* ---------- level picker ---------- */
  function unlocked() { var m = 0; for (var k in save.stars) if (save.stars[k] > 0) m = Math.max(m, +k); return Math.min(MAXLEVEL, m + 1); }
  function openPicker() {
    var o = $('overlay'), tab = tierOf(level), top = unlocked();
    function draw() {
      o.innerHTML = '<div class="picker"><header><h2>Levels</h2></header><div class="tabs"></div><div class="grid"></div></div>';
      var hd = o.querySelector('header');
      var close = document.createElement('button'); close.type = 'button'; close.textContent = 'Close';
      close.onclick = function () { if (state === 'loading' || state === 'play' || state === 'won' || state === 'lost') { if (puzzle && state !== 'loading') hideOverlay(); else hideOverlay(); } };
      hd.appendChild(close);
      var tabs = o.querySelector('.tabs'), grid = o.querySelector('.grid');
      TIERS.forEach(function (t, i) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
        b.setAttribute('aria-pressed', String(i === tab));
        b.onclick = function () { tab = i; draw(); };
        tabs.appendChild(b);
      });
      for (var L = tab * 50 + 1; L <= Math.min(MAXLEVEL, tab * 50 + 50); L++) {
        (function (L) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'lv' + (L === level ? ' cur' : '');
          b.disabled = L > top;
          var n = document.createElement('span'); n.textContent = L; b.appendChild(n);
          var pips = document.createElement('span'); pips.className = 'pips';
          for (var s = 1; s <= 3; s++) { var p = document.createElement('i'); if ((save.stars[L] || 0) >= s) p.className = 'on'; pips.appendChild(p); }
          b.appendChild(pips);
          b.setAttribute('aria-label', 'Level ' + L + ', ' + (save.stars[L] || 0) + ' stars');
          b.onclick = function () { loadLevel(L); };
          grid.appendChild(b);
        })(L);
      }
      var cur = grid.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
    }
    draw(); o.hidden = false;
  }

  /* ---------- input ---------- */
  function ptr(e) { var rc = cv.getBoundingClientRect(); return [(e.clientX - rc.left - ix) / cell, (e.clientY - rc.top - iy) / cell]; }
  cv.addEventListener('pointerdown', function (e) {
    if (state !== 'play' || !$('overlay').hidden) return;
    var q = ptr(e), c = Math.floor(q[0]), r = Math.floor(q[1]);
    if (c < 0 || r < 0 || c >= N || r >= N) return;
    var g = occ(blocks), i = g[r * N + c];
    if (i < 0) return;
    var b = blocks[i], lo = b.pos, hi = b.pos;
    while (lo - 1 >= 0 && g[cellIdx(b, lo - 1)] < 0) lo--;
    while (hi + b.len < N && g[cellIdx(b, hi + b.len)] < 0) hi++;
    var axis = b.dir === 0 ? q[0] : q[1];
    drag = { i: i, from: b.pos, lo: lo, hi: hi, off: axis - b.pos };
    hint = null;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var b = blocks[drag.i], q = ptr(e), axis = b.dir === 0 ? q[0] : q[1];
    b.v = Math.max(drag.lo, Math.min(drag.hi, axis - drag.off));
  });
  function release() {
    if (!drag) return;
    var b = blocks[drag.i], np = Math.max(drag.lo, Math.min(drag.hi, Math.round(b.v))), d = drag;
    drag = null;
    if (np !== d.from) { b.pos = np; finishMove(d.i, d.from); }
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  /* ---------- drawing ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function mix(hex, to, t) {
    var a = parseInt(hex.slice(1), 16), b = to === 'w' ? 255 : 0, out = '#';
    [16, 8, 0].forEach(function (s) {
      var c = (a >> s) & 255; c = Math.round(c + (b - c) * t);
      out += ('0' + c.toString(16)).slice(-2);
    });
    return out;
  }
  function rect(b) {
    return b.dir === 0
      ? { x: ix + b.v * cell, y: iy + b.fixed * cell, w: b.len * cell, h: cell }
      : { x: ix + b.fixed * cell, y: iy + b.v * cell, w: cell, h: b.len * cell };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.floor(Math.min((W - 12) / (N + 0.28 + 0.6), (H - 12) / (N + 0.28)));
    cell = Math.max(24, cell);
    F = Math.round(cell * 0.14); bw = N * cell + 2 * F;
    bx = Math.round((W - (bw + cell * 0.5)) / 2); by = Math.round((H - bw) / 2);
    ix = bx + F; iy = by + F;
  }
  window.addEventListener('resize', resize);

  function drawBlock(b, isTarget, now, lifted, glow) {
    var r = rect(b), pad = cell * 0.07, x = r.x + pad, y = r.y + pad, w = r.w - 2 * pad, h = r.h - 2 * pad, rad = cell * 0.22;
    var base = isTarget ? TARGET : PAL[b.color];
    rr(x, y + cell * (lifted ? 0.08 : 0.05), w, h, rad); ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fill();
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, mix(base, 'w', 0.28)); g.addColorStop(0.55, base); g.addColorStop(1, mix(base, 'k', 0.22));
    rr(x, y, w, h, rad); ctx.fillStyle = g; ctx.fill();
    rr(x + 1.5, y + 1.5, w - 3, h - 3, rad - 1); ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (glow) { rr(x - 2, y - 2, w + 4, h + 4, rad + 2); ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.55 + 0.4 * Math.sin(now / 140); ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1; }
    for (var k = 0; k < b.len; k++) {
      var cx = b.dir === 0 ? r.x + (k + 0.5) * cell : r.x + cell / 2, cy = b.dir === 0 ? r.y + cell / 2 : r.y + (k + 0.5) * cell;
      if (isTarget) {
        ctx.beginPath(); ctx.moveTo(cx - cell * 0.1, cy - cell * 0.17); ctx.lineTo(cx + cell * 0.1, cy); ctx.lineTo(cx - cell * 0.1, cy + cell * 0.17);
        ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = cell * 0.075; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      } else {
        var o = cell * 0.1, dx = b.dir === 0 ? 0 : o, dy = b.dir === 0 ? o : 0;
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        [-1, 1].forEach(function (sgn) { ctx.beginPath(); ctx.arc(cx + sgn * dx, cy + sgn * dy, cell * 0.04, 0, Math.PI * 2); ctx.fill(); });
      }
    }
  }

  function render(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // frame, floor, exit opening
    rr(bx, by, bw, bw, cell * 0.28); ctx.fillStyle = '#2a354a'; ctx.fill();
    rr(ix, iy, N * cell, N * cell, cell * 0.16); ctx.fillStyle = '#18202d'; ctx.fill();
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      rr(ix + c * cell + 2, iy + r * cell + 2, cell - 4, cell - 4, cell * 0.12);
      ctx.fillStyle = (r + c) % 2 ? '#1d2636' : '#1a2230'; ctx.fill();
    }
    ctx.fillStyle = '#11151d'; ctx.fillRect(ix + N * cell - 2, iy + 2 * cell + 3, F + 4, cell - 6);
    var pulse = 0.5 + 0.5 * Math.sin(now / 320);
    for (var a = 0; a < 2; a++) {
      var ax = bx + bw + cell * (0.08 + a * 0.2), ay = iy + 2.5 * cell;
      ctx.beginPath(); ctx.moveTo(ax, ay - cell * 0.2); ctx.lineTo(ax + cell * 0.16, ay); ctx.lineTo(ax, ay + cell * 0.2);
      ctx.strokeStyle = '#ffc233'; ctx.globalAlpha = reduce ? 0.9 : 0.35 + 0.65 * (a ? pulse : 1 - pulse);
      ctx.lineWidth = cell * 0.09; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ease blocks toward their cells
    var k = reduce ? 1 : 1 - Math.exp(-dt * 20);
    blocks.forEach(function (b, i) {
      if (drag && drag.i === i) return;
      b.v += (b.pos - b.v) * k;
      if (Math.abs(b.pos - b.v) < 0.002) b.v = b.pos;
    });

    if (hint && now > hint.until) hint = null;
    if (hint) {
      var hb = blocks[hint.i], gh = { dir: hb.dir, len: hb.len, fixed: hb.fixed, v: hint.to }, gr = rect(gh);
      rr(gr.x + cell * 0.1, gr.y + cell * 0.1, gr.w - cell * 0.2, gr.h - cell * 0.2, cell * 0.18);
      ctx.setLineDash([cell * 0.14, cell * 0.1]); ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.5 + 0.4 * Math.sin(now / 160); ctx.lineWidth = 2.5; ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    for (var i = blocks.length - 1; i >= 0; i--) {
      if (i === 0 && blocks.length > 1) continue;
      var bb = blocks[i];
      drawBlock(bb, i === 0, now, drag && drag.i === i, hint && hint.i === i);
    }
    if (blocks.length > 1) drawBlock(blocks[0], true, now, drag && drag.i === 0, hint && hint.i === 0);

    requestAnimationFrame(render);
  }

  resize();
  loadLevel(Math.min(MAXLEVEL, Math.max(1, save.level || 1)));
  requestAnimationFrame(render);
})();
</script>
